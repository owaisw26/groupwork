services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: groupwork
      POSTGRES_PASSWORD: groupwork
      POSTGRES_DB: groupwork
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupwork -d groupwork"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://groupwork:groupwork@db:5432/groupwork
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
